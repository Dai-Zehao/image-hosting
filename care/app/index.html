        <h1>R6 Care 需要通过 Vite 启动</h1>

          radial-gradient(circle at 20% 15%, rgba(119, 198, 178, .3), transparent 30%),

          linear-gradient(135deg, #10120f, #20231d);
      }

      .file-open-hint h1,
      .file-open-hint p {
        max-width: 640px;
        margin: 0;
      }

      .file-open-hint code {
        width: max-content;
        max-width: 100%;
        padding: 12px 14px;
        border: 1px solid rgba(255, 255, 255, .2);
        border-radius: 14px;
